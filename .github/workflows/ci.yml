name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used for development, so CI checks the same
          # analyzer rules and (with the committed pubspec.lock) the same
          # package versions. Upgrade deliberately: run `flutter upgrade`
          # locally, fix any new analyzer findings, then bump this.
          flutter-version: 3.41.6
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Cloud Functions (M4): score-validation unit tests, then the Firestore
  # security rules against the real rules engine in the local emulator.
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5 # the Firestore emulator needs Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm install -g firebase-tools@15
      - run: npm run test:rules
