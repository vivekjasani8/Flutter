# Launch (splash) screen in the brand navy with the gold fan + SimCoin.
# Regenerate with:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E1726"
  image: assets/branding/splash.png
  android: true
  ios: true

  # Android 12+ uses the system splash API: an icon inside a circle on a
  # solid colour.
  android_12:
    color: "#0E1726"
    image: assets/branding/splash_android12.png
