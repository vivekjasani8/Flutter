name: idle_miner_sim
description: "Idle Miner Sim — a virtual crypto-mining idle game. All coins are virtual; nothing is mined, earned or paid out."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
